<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - ShopHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🛍️ ShopHub</a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button id="searchBtn">🔍</button>
      </div>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/pages/products.html">Products</a>
        <a href="/pages/cart.html" class="cart-link">🛒 Cart <span id="cartCount" class="cart-badge">0</span></a>
        <a href="/pages/orders.html" id="ordersLink" class="hidden">Orders</a>
        <div id="authArea"></div>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    </div>
  </nav>

  <div class="container" style="padding:2rem 20px">
    <h1 style="margin-bottom:1.5rem">All Products</h1>
    <div class="filters">
      <div class="filter-group">
        <label>Category</label>
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Sports">Sports</option>
          <option value="Home">Home</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Sort By</label>
        <select id="sortFilter">
          <option value="">Newest</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Min Price</label>
        <input type="number" id="minPrice" placeholder="0" min="0">
      </div>
      <div class="filter-group">
        <label>Max Price</label>
        <input type="number" id="maxPrice" placeholder="1000" min="0">
      </div>
    </div>
    <div id="productsGrid" class="product-grid">
      <div class="loading">Loading products...</div>
    </div>
    <div id="pagination" style="text-align:center;padding:2rem 0"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
