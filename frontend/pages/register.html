<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - ShopHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🛍️ ShopHub</a>
      <div class="nav-links" style="margin-left:auto">
        <a href="/">Home</a>
        <a href="/pages/products.html">Products</a>
      </div>
    </div>
  </nav>
  <div class="auth-container">
    <h2>Create Account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required minlength="2">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/pages/login.html">Login</a></p>
  </div>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        setAuth(data.token, data.user);
        showToast('Registration successful!', 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
