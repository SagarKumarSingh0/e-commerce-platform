<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopHub - Premium E-commerce</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🛍️ ShopHub</a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button id="searchBtn">🔍</button>
      </div>
      <div class="nav-links">
        <a href="/pages/products.html">Products</a>
        <a href="/pages/cart.html" class="cart-link">
          🛒 Cart <span id="cartCount" class="cart-badge">0</span>
        </a>
        <a href="/pages/orders.html" id="ordersLink" class="hidden">My Orders</a>
        <a href="/pages/admin.html" id="adminLink" class="hidden">Admin</a>
        <div id="authArea"></div>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Discover Amazing Products</h1>
      <p>Shop the latest trends with fast delivery and secure payments</p>
      <a href="/pages/products.html" class="btn btn-primary btn-large">Shop Now</a>
    </div>
  </section>

  <section class="container">
    <h2 class="section-title">Featured Products</h2>
    <div id="featuredProducts" class="product-grid">
      <div class="loading">Loading products...</div>
    </div>
  </section>

  <footer>
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <p>© 2026 ShopHub. Final Year Project - E-commerce Platform</p>
      <a href="/pages/contact.html" style="color:white; text-decoration:none;">Contact Us</a>
    </div>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
