<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - ShopHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🛍️ ShopHub</a>
      <div class="nav-links" style="margin-left:auto">
        <a href="/">Home</a>
        <a href="/pages/products.html">Products</a>
        <a href="/pages/cart.html">Cart</a>
        <div id="authArea"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding:4rem 20px; max-width:800px;">
    <h1 style="text-align:center; margin-bottom:0.5rem;">Contact Us</h1>
    <p style="text-align:center; color:var(--gray); margin-bottom:2.5rem;">Have a question? We'd love to hear from you.</p>

    <div style="background:white; padding:2rem; border-radius:12px; box-shadow:var(--shadow); display:grid; grid-template-columns: 1fr 1fr; gap:2rem;">
      
      <!-- Contact Info -->
      <div>
        <h3 style="margin-bottom:1rem;">Get in Touch</h3>
        <p style="margin-bottom:1rem; font-size:0.95rem; color:var(--gray);">
          Fill out the form and our team will get back to you within 24 hours.
        </p>
        <div style="margin-bottom:1rem;">
          <strong>📧 Email:</strong> <br> singhsagarkumar0@gmail.com
        </div>
        <div style="margin-bottom:1rem;">
          <strong>📞 Phone:</strong> <br> +91 79708 04528
        </div>
        <div>
          <strong>📍 Address:</strong> <br> Raxaul,<br> Bihar, India
        </div>
      </div>

      <!-- Contact Form -->
      <form id="contactForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="cName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="cEmail" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <select id="cSubject" required>
            <option value="">Select a topic...</option>
            <option value="Order Issue">Order Issue</option>
            <option value="Return/Refund">Return/Refund</option>
            <option value="Product Inquiry">Product Inquiry</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="cMessage" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/chatbot.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Sending...';
      
      try {
        await apiFetch('/contact', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('cName').value,
            email: document.getElementById('cEmail').value,
            subject: document.getElementById('cSubject').value,
            message: document.getElementById('cMessage').value
          })
        });
        showToast('Message sent successfully! We will reply soon.', 'success');
        e.target.reset();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Send Message';
      }
    });
  </script>
</body>
</html>
