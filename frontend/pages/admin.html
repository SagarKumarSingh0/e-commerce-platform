<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - ShopHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🛍️ ShopHub Admin</a>
      <div class="nav-links" style="margin-left:auto">
        <a href="/">Store Home</a>
        <div id="authArea"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding:2rem 20px">
    <h1 style="margin-bottom:1.5rem">Admin Dashboard</h1>
    
    <!-- Stats Cards -->
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-bottom:2rem;">
      <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--shadow);">
        <h3 style="color:var(--gray); font-size:0.9rem;">Total Users</h3>
        <p id="totalUsers" style="font-size:2rem; font-weight:700; color:var(--primary);">0</p>
      </div>
      <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--shadow);">
        <h3 style="color:var(--gray); font-size:0.9rem;">Total Orders</h3>
        <p id="totalOrders" style="font-size:2rem; font-weight:700; color:var(--primary);">0</p>
      </div>
      <div style="background:white; padding:1.5rem; border-radius:12px; box-shadow:var(--shadow);">
        <h3 style="color:var(--gray); font-size:0.9rem;">Total Revenue</h3>
        <p id="totalRevenue" style="font-size:2rem; font-weight:700; color:var(--success);">$0.00</p>
      </div>
    </div>

    <!-- Product Management -->
    <div style="background:white; padding:2rem; border-radius:12px; box-shadow:var(--shadow);">
      <h2 style="margin-bottom:1rem;">Add New Product</h2>
      <form id="addProductForm" style="display:grid; gap:1rem; max-width:600px;">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="pDesc" rows="3" required></textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" id="pPrice" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="pStock" required>
          </div>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="pCategory" required>
            <option value="Electronics">Electronics</option>
            <option value="Sports">Sports</option>
            <option value="Home">Home</option>
            <option value="Accessories">Accessories</option>
          </select>
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="url" id="pImage" placeholder="https://example.com/image.jpg">
        </div>
        <button type="submit" class="btn btn-primary">Add Product</button>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = getUser();
      if (!user || user.role !== 'admin') {
        window.location.href = '/';
        return;
      }

      // Load Stats
      try {
        const stats = await apiFetch('/admin/stats');
        document.getElementById('totalUsers').textContent = stats.totalUsers;
        document.getElementById('totalOrders').textContent = stats.totalOrders;
        document.getElementById('totalRevenue').textContent = '₹' + stats.totalRevenue.toFixed(2);
      } catch (err) { showToast(err.message, 'error'); }

      // Handle Add Product
      document.getElementById('addProductForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/products', {
            method: 'POST',
            body: JSON.stringify({
              name: document.getElementById('pName').value,
              description: document.getElementById('pDesc').value,
              price: Number(document.getElementById('pPrice').value),
              stock: Number(document.getElementById('pStock').value),
              category: document.getElementById('pCategory').value,
              image: document.getElementById('pImage').value || 'https://via.placeholder.com/300'
            })
          });
          showToast('Product added successfully!', 'success');
          e.target.reset();
        } catch (err) { showToast(err.message, 'error'); }
      });
    });
  </script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
